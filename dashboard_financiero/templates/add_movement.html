{% extends "base.html" %}

{% block title %}Añadir movimiento · Dashboard{% endblock %}

{% block content %}
<div class="add-movement-page">
  <header class="amp-header">
    <div class="amp-icon">+</div>
    <div>
      <h1>Añadir movimiento</h1>
      <p>Registra un ingreso o un gasto en segundos.</p>
    </div>
  </header>

  <section class="amp-card">
    <form method="POST" action="{{ url_for('add_movimiento') }}">
      <div class="amp-grid">
        <div class="amp-field">
          <label for="fecha">Fecha</label>
          <input type="date" id="fecha" name="fecha" required>
        </div>

        <div class="amp-field">
          <label for="concepto">Concepto</label>
          <input type="text" id="concepto" name="concepto"
                 placeholder="Ej: Supermercado, Nómina" required>
        </div>

        <div class="amp-field">
          <label for="categoria">Categoría</label>
          <select id="categoria" name="categoria" required>
            <option value="" disabled selected>Selecciona una categoría</option>
            {% for cat in categorias %}
            <option value="{{ cat }}">{{ cat }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="amp-field">
          <label for="importe">Importe (€)</label>
          <input type="number" step="0.01" min="0" id="importe"
                 name="importe" placeholder="0,00" required>
        </div>

        <div class="amp-field">
          <label for="tipo">Tipo</label>
          <select id="tipo" name="tipo" required>
            <option value="" disabled selected>Selecciona un tipo</option>
            <option value="ingreso">Ingreso</option>
            <option value="gasto">Gasto</option>
          </select>
        </div>
      </div>

      <button type="submit" class="amp-btn-primary">
        Guardar movimiento
      </button>
    </form>

    <a href="{{ url_for('dashboard') }}" class="amp-link-back">
      ← Volver al dashboard
    </a>
  </section>
</div>
{% endblock %}
